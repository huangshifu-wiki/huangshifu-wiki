<!doctype html>
<html lang="cn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#b07b17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      window.__HSF_BOOTSTRAP_AUTH_UID__ = '__HSF_BOOTSTRAP_AUTH_UID_VALUE__'
    </script>
    <script>
      ;(function () {
        try {
          var themeMeta = { default: '#b07b17', dark: '#0c0c12' }
          var k = 'user_preferences'
          var raw = localStorage.getItem(k)
          var parsed = raw ? JSON.parse(raw) : {}
          var isObj = parsed && typeof parsed === 'object' && !Array.isArray(parsed)
          var bootstrapUid =
            typeof window.__HSF_BOOTSTRAP_AUTH_UID__ === 'string' &&
            window.__HSF_BOOTSTRAP_AUTH_UID__.trim()
              ? window.__HSF_BOOTSTRAP_AUTH_UID__.trim()
              : null
          var legacy = isObj && !('guest' in parsed) && !('users' in parsed) ? parsed : undefined
          var users =
            isObj &&
            parsed.users &&
            typeof parsed.users === 'object' &&
            !Array.isArray(parsed.users)
              ? parsed.users
              : null
          var userSource =
            bootstrapUid && users && users[bootstrapUid] && typeof users[bootstrapUid] === 'object'
              ? users[bootstrapUid]
              : undefined
          var source = bootstrapUid
            ? userSource || legacy
            : isObj && parsed.guest && typeof parsed.guest === 'object'
              ? parsed.guest
              : legacy
          var mode = source && typeof source.theme === 'string' ? source.theme : 'system'
          if (mode !== 'default' && mode !== 'dark' && mode !== 'system') {
            mode = 'system'
          }
          var resolved =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'default'
              : mode
          var root = document.documentElement
          root.setAttribute('data-theme', resolved)
          root.style.colorScheme = resolved === 'dark' ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            meta.setAttribute('content', themeMeta[resolved] || themeMeta.default)
          }
        } catch (e) {}
      })()
    </script>

    <!--
      启动占位（splash）样式：
      JS/CSS 加载完成前 #root 为空，用品牌化加载画面避免白屏。
      内联在 head 保证首帧前生效；React 挂载后由 hideStaticFallback 淡出移除。
      配色与 index.css 的 --color-theme-bg / 品牌金保持一致。
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f5f0;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.25s ease;
      }
      #boot-splash.boot-splash--hide {
        opacity: 0;
      }
      [data-theme='dark'] #boot-splash {
        background: #1f1a16;
      }
      .boot-splash__ring {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid rgba(176, 123, 23, 0.25);
        border-top-color: #b07b17;
        animation: boot-splash-spin 0.9s linear infinite;
      }
      .boot-splash__title {
        font-family: 'STKaiti', 'KaiTi', serif;
        font-size: 17px;
        letter-spacing: 0.35em;
        text-indent: 0.35em;
        color: #8a6313;
      }
      [data-theme='dark'] .boot-splash__title {
        color: #d9b268;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- 预连接到关键第三方域名，加速后续请求但不阻塞渲染 -->
    <link rel="dns-prefetch" href="https://gator.volces.com" />
    <link rel="dns-prefetch" href="https://analysis.chatglm.cn" />
    <link rel="dns-prefetch" href="https://kimi.moonshot.cn" />
    <link rel="dns-prefetch" href="https://webapi.amap.com" />

    <!-- 预连接（不阻塞渲染） -->
    <link rel="preconnect" href="https://webapi.amap.com" crossorigin="anonymous" />

    <link rel="manifest" href="/manifest.json" />

    <!--
      字体加载优化策略：
      1. 使用系统字体栈（system font stack），无需下载外部字体文件
      2. CSS 中已设置 font-display: swap，避免 FOIT（Flash of Invisible Text）
      3. 字体回退链：系统默认字体 → 中文字体 → 通用衬线/无衬线字体
      4. 如需添加自定义字体，请在此处添加 <link rel="preload" href="/fonts/font.woff2" as="font" type="font/woff2" crossorigin />
    -->

    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <title>黄诗扶 Wiki</title>

    <!-- SVG滤镜定义 -->
    <svg width="0" height="0" class="svg-defs-container">
      <defs>
        <filter id="glass-distortion">
          <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="5"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>

    <!--
      第三方脚本延迟加载策略：
      1. 浏览器扩展脚本（如 Kimi、ChatGLM 扩展）无法直接控制
      2. 对于应用主动加载的第三方脚本，使用以下策略：
         - async/defer 属性避免阻塞解析
         - requestIdleCallback 延迟非关键脚本
         - 用户交互后再加载分析类脚本
    -->
    <script src="/third-party-loader.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动占位：React 挂载前填充首帧，避免白屏；挂载后淡出移除 -->
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash__ring"></div>
      <div class="boot-splash__title">黄诗扶 Wiki</div>
    </div>
    <footer id="static-footer" class="static-fallback-footer">
      <a
        href="https://img.lhl.one"
        target="_blank"
        rel="nofollow noopener noreferrer"
        class="static-fallback-link"
        >Image Hub</a
      >
      <a
        href="http://www.freecdn.vip/?zzwz"
        target="_blank"
        rel="nofollow noopener noreferrer"
        class="static-fallback-link static-fallback-link--ml"
        >LHL's Images</a
      >
      <p>
        黄诗扶 Wiki · 联系邮箱：<a href="mailto:contact@huangshifu.wiki">contact@huangshifu.wiki</a>
      </p>
    </footer>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      内联而非独立文件：脚本必须与 HTML 同版本传输，否则旧缓存文件会导致
      新版 splash 无法移除（部署后界面被永久遮挡）。
    -->
    <script>
      ;(function () {
        var shown = false
        var staticFooter = document.getElementById('static-footer')
        var bootSplash = document.getElementById('boot-splash')
        var desktopMedia = window.matchMedia('(min-width: 768px)')

        function removeNode(node) {
          if (node && node.parentNode) {
            node.parentNode.removeChild(node)
          }
        }

        // React 挂载后淡出移除 splash；超时兜底直接移除，避免 JS 失败时动画永远转圈
        function hideBootSplash(withFade) {
          if (!bootSplash) return
          if (withFade) {
            bootSplash.classList.add('boot-splash--hide')
            setTimeout(function () {
              removeNode(bootSplash)
            }, 300)
          } else {
            removeNode(bootSplash)
          }
        }

        var timer = setTimeout(function () {
          // 兜底：超时后不允许 splash 永久遮挡界面
          hideBootSplash(false)
          if (!window.__REACT_MOUNTED__ && staticFooter && !shown && desktopMedia.matches) {
            shown = true
            staticFooter.style.display = 'block'
          }
        }, 8000)

        window.hideStaticFallback = function () {
          clearTimeout(timer)
          window.__REACT_MOUNTED__ = true
          hideBootSplash(true)
          if (staticFooter) {
            staticFooter.style.display = 'none'
          }
        }
      })()
    </script>
  </body>
</html>
